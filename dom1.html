<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
</head>
<body>

<form id="container">

    <input id="user1" type="text" placeholder="Enter your name">

    <input id="user2" type="text" placeholder="Enter second name">

    <input id="user3" type="number" placeholder="Enter your age">

    <input id="user4" type="text" placeholder="Enter your city">

    <button type="submit">Submit</button>

</form>

<script>

document.getElementById("container").addEventListener("submit", function(event){

    let input1 = document.getElementById("user1").value;
    let input2 = document.getElementById("user2").value;
    let input3 = document.getElementById("user3").value;
    let input4 = document.getElementById("user4").value;

    if(input1 === ""){
        alert("Please enter first name");
        event.preventDefault();
    }

    if(input2 !== "shubham"){
        alert("Name must be shubham")
        event.preventDefault();
    }

    if(input3 < 18){
        alert("Age must be 18 or above");
        event.preventDefault();
    }

    if(input4 !== "ujjain"){
        alert("City must be Ujjain");
        event.preventDefault();
    }
    else{
        console.log("You successfully registered");
    }

});

</script>

</body>
</html>
