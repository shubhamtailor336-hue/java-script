<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dom selector</title>
</head>
<body>

  <!-- idselector => document.getElementById("idname"); -->
  
   <button id="myButton" onclick="changeText()">Click Me</button>
   <input type="text" id="myInput" placeholder="Enter text here">
   <button id="myInputButton" onclick="updateText()">Update Text</button>
 <script>
   function changeText() {
     document.getElementById("myButton").style.background = "lightblue";
     document.getElementById("myButton").innerText = "Clicked!";
     document.getElementById("myButton").style.color = "white";
     document.getElementById("myButton").style.fontSize = "20px";
     document.getElementById("myButton").style.padding = "10px 20px";
    document.getElementById("myButton").style.border = "none";

   }
   function updateText(){
     document.getElementById("myInput").style.border = "2px solid red";
     document.getElementById("myInput").style.padding = "5px";
     document.getElementById("myInput").style.fontSize = "16px";

   }
 </script>

 <!-- class selector => document.getElementsByClassName("classname"); -->

 <div class="myClass">
  "This is a div with class "myClass"
<p class="para">This is a paragraph with class "para"</p>
</p>
</div>
<button class="myClass" onclick="changeClassText()">Click Me</button>

<button class="btn" onclick="changeParaText()">change text para</button>
<script>
  function changeClassText() {
    let elements = document.getElementsByClassName("myClass");
    for (let i = 0; i < elements.length; i++) {
      elements[i].style.backgroundColor = "lightgreen";
      elements[i].style.padding = "10px";
      elements[i].style.fontSize = "18px";
      elements[i].style.border = "3px solid yellow";
    }
  }
  document.getElementsByClassName("para")[0].style.color = "blue";
  function changeParaText() {
    let paraElements = document.getElementsByClassName("para");
    for (let i = 0; i < paraElements.length; i++) {
      paraElements[i].style.color = "red";
      paraElements[i].style.fontSize = "20px";
      paraElements[i].style.fontWeight = "bold";
    }
  }

</script>
 <div class="box">Box 1</div>
 <div class="box">Box 2</div>
 <button onclick="toggleBoxes()">Toggle Boxes</button>
 <script>
   function toggleBoxes() {
     let boxes = document.getElementsByClassName("box");
     for (let i = 0; i < boxes.length; i++) {
       boxes[i].style.display = boxes[i].style.display === "none" ? "block" : "none";
     }
   }
 </script>

  <a href="#">Link 1</a>
 <a href="#">Link 2</a>
 <p id="linkCount"></p>
 <script>
   let links = document.getElementsByTagName("a");
   document.getElementById("linkCount").innerText = "Total Links: " + links.length;
 </script>

<button id="click" onclick="handleClick()">Click me</button>;
<script>
  function handleClick() {
    let button = document.getElementById("click");
    button.setAttribute("disabled", "true");
    button.innerText = "Clicked!";
  }
</script>
